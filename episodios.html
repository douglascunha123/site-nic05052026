<!DOCTYPE html>
<html lang="pt-br">

<title>Episódios</title>

<body>

<h1 class="title">Episódios</h1>

<button class="next-btn" onclick="nextEpisode()">▶ Próximo episódio</button>
</div>
</div>

<audio id="player"></audio>

<script src="script.js"></script>
